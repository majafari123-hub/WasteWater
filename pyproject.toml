[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsm1-diffusion-active-inference"
version = "0.1.0"
description = "Experiment harness for BSM1 partial-observation control research"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]
